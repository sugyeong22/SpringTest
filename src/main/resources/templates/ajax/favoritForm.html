<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>즐겨찾기 추가하기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>

    <div class="container center">
        <h2>즐겨찾기 추가하기</h2>
        <label>제목</label><input type="text" class="form-control" id="nameInput"> <br>
        <label>주소</label><input type="text" class="form-control" id="urlInput"> <br>
        <button type="button" class="form-control  btn-success" id="button">추가</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        $("#button").on("click", function(){
            let name = $("#nameInput").val();
            let url = $("#urlInput").val();

            // 유효성 검사
            if(name == ""){
                alert("이름을 입력하세요");
                return;
            }
            if(url == ""){
                alert("주소를 입력하세요");
                return;
            }

            // 입력받은 값을 controller에 넣기
            $.ajax({
                type: "post"
                , url: "/ajax/favorit/add"
                , data :{"name" : name, "url":url}
                , sucess: function(responce){
                    if(responce.result == "sucess"){
                        alert("성공");
                    } else{
                        alert("사용자 추가 실패");
                    }
                }
                , error: function(){
                    alert("사용자 추가 에러");
                }
            })
        })



    </script>

</body>
</html>
