<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기상청</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/thymeleaf/totalTest/style.css">
</head>
<body>
    <div id="wrap">
        <header class="header col-3 bg-info " >
            <div class="d-flex justify-content-center align-items-center">
                <img class="logo " alt="로고 이미지" src="http://marondal.com/material/images/dulumary/web/jstl/weather-logo.png">
                <div class="text-white font-weight-bold"> 기상청 </div>
            </div>
        </header>

        <section class="d-flex">
            <nav class="menu bg-info col-3">
                <ul class="nav flex-column">
                    <il class="nav-item"><a href="#" class="nav-link text-white font-weight-bold">날씨</a></il>
                    <il class="nav-item"><a href="#" class="nav-link text-white font-weight-bold">날씨입력</a></il>
                    <il class="nav-item"><a href="#" class="nav-link text-white font-weight-bold">테마날씨</a></il>
                    <il class="nav-item"><a href="#" class="nav-link text-white font-weight-bold">관측기후</a></il>
                </ul>
            </nav>
            <article class="table">
                <h3>과거 날씨</h3>
                <table class="table text-center">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>날씨</th>
                            <th>기온</th>
                            <th>강수량</th>
                            <th>미세먼지</th>
                            <th>풍속</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="weather:${weatherList}">
                            <td th:text="${#temporals.format(weather.date, 'yyyy년 M월 d일')}">날짜</td>
                            <td th:switch="${weather. weather}">
                                <img th:case="맑음" src="http://marondal.com/material/images/dulumary/web/jstl/sunny.jpg">
                                <img th:case="구름조금" src="http://marondal.com/material/images/dulumary/web/jstl/partlyCloudy.jpg">
                                <img th:case="흐림" src="http://marondal.com/material/images/dulumary/web/jstl/cloudy.jpg">
                                <img th:case="비" src="http://marondal.com/material/images/dulumary/web/jstl/rainy.jpg">
                                <span th:case="*" th:text="${weather.weather}"></span>
                            </td>
                            <td th:text="|${weather.temperatures}°C|">24.8°C</td>
                            <td th:text="|${weather.precipitation}mm|">강수량</td>
                            <td th:text="${weather.microDust}">미세먼지</td>
                            <td th:text="|${weather.windSpeed}km/h|">풍속</td>
                        </tr>
                    </tbody>
                </table>
            </article>
        </section>
        <footer class="d-flex">
            <img width="120" class="mt-3 ml-4" src="http://marondal.com/material/images/dulumary/web/jstl/weather-footer.png">
            <div class="mt-3 ml-5 small text-secondary">
                (07062) 서울시 동작구 여의대방로16길 61  <br>
                Copyright@2024 KMA. All Rights RESERVED.
            </div>
        </footer>
    </div>
</body>
</html>
