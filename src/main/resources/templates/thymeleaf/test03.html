<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>멤버십</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1>멤버십</h1>

        <table class="table">
            <thead>
                <tr>
                    <th>이름</th>
                    <th>전화번호</th>
                    <th>등급</th>
                    <th>포인트</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member:${member}">
                    <td th:text="${member.name}">ㅇㅇ</td>
                    <td th:text="${member.phoneNumber}">ㅇㅇ</td>
                    <td th:switch="${member.grade}">
                        <span th:case="VIP" class="text-danger">VIP</span>
                        <span th:case="GOLD" class="text-warning">GOLD</span>
                        <span th:case="*" th:text="${member.grade}">BASIC</span>
                    </td>
                    <td>
                        <span th:if="${member.point >= 5000 }" th:text="|${member.point}P|" class="text-primary">ff</span>
                        <span th:unless="${member.point >= 5000}" th:text="|${member.point}P|">ff</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>


</body>
</html>
